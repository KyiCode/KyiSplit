name: Verify and package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, package, and publish artifact
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kyisplit_ci
          POSTGRES_PASSWORD: kyisplit_ci_test_only
          POSTGRES_DB: kyisplit_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyisplit_ci -d kyisplit_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Java for Flyway
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install pinned Flyway Command-line
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/13.11.1/flyway-commandline-13.11.1-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/flyway.tar.gz"
          mkdir -p "$RUNNER_TEMP/flyway"
          tar -xzf "$RUNNER_TEMP/flyway.tar.gz" -C "$RUNNER_TEMP/flyway" --strip-components=1
          echo "$RUNNER_TEMP/flyway" >> "$GITHUB_PATH"

      - name: Install backend dependencies from lockfile
        run: npm ci --prefix backend

      - name: Install frontend dependencies from lockfile
        run: npm ci --prefix frontend

      - name: Apply and validate Flyway migrations on fresh PostgreSQL
        working-directory: backend
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/kyisplit_migrations
          FLYWAY_USER: kyisplit_ci
          FLYWAY_PASSWORD: kyisplit_ci_test_only
        run: |
          flyway -configFiles=flyway.conf migrate
          flyway -configFiles=flyway.conf validate
          npm run schema:check -- --database-url postgresql://kyisplit_ci:kyisplit_ci_test_only@localhost:5432/kyisplit_migrations

      - name: Install PostgreSQL tools for isolated browser database
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16

      - name: Prepare stopped, migrated E2E database template
        working-directory: backend
        env:
          FLYWAY_HOME: ${{ runner.temp }}/flyway
        run: |
          pg_bin=/usr/lib/postgresql/16/bin
          template="$RUNNER_TEMP/kyisplit-e2e-template"
          "$pg_bin/initdb" -D "$template" -U kyisplit_e2e --auth-local=trust --auth-host=trust --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$template" -l "$RUNNER_TEMP/kyisplit-e2e-template.log" -o "-p 55433 -h 127.0.0.1" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55433 -U kyisplit_e2e kyisplit_e2e_template
          flyway -configFiles=flyway.conf -url=jdbc:postgresql://127.0.0.1:55433/kyisplit_e2e_template -user=kyisplit_e2e migrate
          flyway -configFiles=flyway.conf -url=jdbc:postgresql://127.0.0.1:55433/kyisplit_e2e_template -user=kyisplit_e2e validate
          "$pg_bin/pg_ctl" -D "$template" -m fast -w stop

      - name: Test backend
        run: npm --prefix backend test

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Install Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Run isolated Chromium journey
        env:
          E2E_POSTGRES_BIN_DIR: /usr/lib/postgresql/16/bin
          E2E_POSTGRES_TEMPLATE_DIR: ${{ runner.temp }}/kyisplit-e2e-template
        run: npm --prefix frontend run test:e2e

      - name: Build and archive the verified artifact
        env:
          RELEASE_VERSION: ${{ github.sha }}
          FLYWAY_HOME: ${{ runner.temp }}/flyway
        run: |
          npm --prefix backend run build:artifact
          npm --prefix backend run archive:artifact -- "$RELEASE_VERSION"

      - name: Upload checksummed production artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kyisplit-${{ github.sha }}
          path: |
            release/kyisplit-${{ github.sha }}.tar.gz
            release/kyisplit-${{ github.sha }}.tar.gz.sha256
            !frontend/test-results/**
            !frontend/playwright-report/**
            !frontend/.env.e2e.local
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
