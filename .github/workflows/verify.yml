name: Verify and package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, package, and publish artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies from lockfile
        run: npm ci --prefix backend

      - name: Install frontend dependencies from lockfile
        run: npm ci --prefix frontend

      - name: Test backend
        run: npm --prefix backend test

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build and archive the verified artifact
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          npm --prefix backend run build:artifact
          npm --prefix backend run archive:artifact -- "$RELEASE_VERSION"

      - name: Upload checksummed production artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kyisplit-${{ github.sha }}
          path: |
            release/kyisplit-${{ github.sha }}.tar.gz
            release/kyisplit-${{ github.sha }}.tar.gz.sha256
            !frontend/test-results/**
            !frontend/playwright-report/**
            !frontend/.env.e2e.local
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
